<text x="60" y="554" font-size="17" font-weight="700" fill="#30352F" text-anchor="start">users  1 ── N  cases</text>
<text x="60" y="584" font-size="14" font-weight="400" fill="#777A75" text-anchor="start">One user (investigator) can create</text>
<text x="60" y="606" font-size="14" font-weight="400" fill="#777A75" text-anchor="start">many cases, linked by cases.created_by.</text>
<rect x="490" y="520" width="420" height="110" rx="12" fill="#FFFFFF" stroke="#DCD4C6" stroke-width="1"/>
<text x="510" y="554" font-size="17" font-weight="700" fill="#30352F" text-anchor="start">cases  1 ── N  evidence</text>
<text x="510" y="584" font-size="14" font-weight="400" fill="#777A75" text-anchor="start">One case can contain many evidence</text>
<text x="510" y="606" font-size="14" font-weight="400" fill="#777A75" text-anchor="start">files, linked by evidence.case_id.</text>
<rect x="940" y="520" width="420" height="110" rx="12" fill="#FFFFFF" stroke="#DCD4C6" stroke-width="1"/>
