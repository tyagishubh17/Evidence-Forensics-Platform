<text x="540" y="717" font-size="14" font-weight="400" fill="#30352F" text-anchor="start">* cases.created_by is not in the original field list. It was added so the</text>
<text x="540" y="739" font-size="14" font-weight="400" fill="#30352F" text-anchor="start">users → cases (1 ── N) relationship can actually be stored.</text>
<text x="510" y="774" font-size="14" font-weight="600" fill="#30352F" text-anchor="start">Proposed design. The Review 1 prototype implements only a simplified evidence</text>
<text x="510" y="796" font-size="14" font-weight="600" fill="#30352F" text-anchor="start">table (no case_id). See docs/database-design.md.</text>
