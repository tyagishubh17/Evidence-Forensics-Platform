<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Wireframe 01 - Login Page</title>
  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill: #30352F; }
    .h1 { font-size: 24px; font-weight: 600; }
    .b { font-size: 14px; }
    .s { font-size: 12px; fill: #777A75; }
    .sub { font-size: 14px; fill: #777A75; }
    .lbl { font-size: 13px; font-weight: 600; }
    .ph { font-size: 14px; fill: #9A9C96; }
    .card { fill: #FFFFFF; stroke: #E2DCCF; stroke-width: 1; }
    .input { fill: #FFFFFF; stroke: #D6D0C3; stroke-width: 1; }
    .ic { fill: none; stroke: #30352F; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Page background -->
  <rect width="1440" height="900" fill="#F8F7F3"/>

  <!-- Login card -->
  <rect x="520" y="140" width="400" height="620" rx="12" class="card"/>

  <!-- Logo mark -->
  <rect x="696" y="180" width="48" height="48" rx="10" fill="#829783"/>
  <path d="M711 192 h12 l7 7 v18 h-19 z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M715 204 h11 M715 209 h11 M715 214 h7" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <text x="720" y="276" class="h1" text-anchor="middle">Digital Evidence Platform</text>
  <text x="720" y="304" class="sub" text-anchor="middle">AI-Driven Digital Evidence Management</text>
  <text x="720" y="324" class="sub" text-anchor="middle">&amp; Preliminary Analysis</text>

  <line x1="544" y1="352" x2="896" y2="352" stroke="#EDE7DC" stroke-width="1"/>

  <!-- Email -->
  <text x="544" y="386" class="lbl">Email address</text>
  <rect x="544" y="396" width="352" height="44" rx="8" class="input"/>
  <text x="560" y="423" class="ph">investigator@example.org</text>

  <!-- Password -->
  <text x="544" y="470" class="lbl">Password</text>
  <rect x="544" y="480" width="352" height="44" rx="8" class="input"/>
  <text x="560" y="508" class="b" letter-spacing="2">••••••••••</text>
  <!-- eye icon -->
  <path d="M862 502 q10 -10 20 0 q-10 10 -20 0 z" class="ic" stroke="#777A75"/>
  <circle cx="872" cy="502" r="2.5" fill="#777A75"/>

  <!-- Role -->
  <text x="544" y="554" class="lbl">Role</text>
  <rect x="544" y="564" width="352" height="44" rx="8" class="input"/>
  <text x="560" y="591" class="b">Investigator</text>
  <path d="M870 583 l6 6 l6 -6" class="ic" stroke="#777A75"/>

  <!-- Sign in button -->
  <rect x="544" y="636" width="352" height="46" rx="8" fill="#829783"/>
  <text x="720" y="664" class="b" text-anchor="middle" style="fill:#FFFFFF;font-weight:600">Sign in</text>

  <!-- Note -->
  <rect x="596" y="712" width="10" height="8" rx="1.5" fill="none" stroke="#777A75" stroke-width="1.3"/>
  <path d="M598 712 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#777A75" stroke-width="1.3"/>
  <text x="614" y="721" class="s">Authorized personnel only · Access is logged</text>

  <!-- Annotations -->
  <text x="24" y="880" class="s">Wireframe — proposed design (Review 1)</text>
  <rect x="1344" y="862" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#829783" stroke-width="1"/>
  <text x="1380" y="879" class="s" text-anchor="middle" style="fill:#5E735F;font-weight:600">Planned</text>
</svg>
