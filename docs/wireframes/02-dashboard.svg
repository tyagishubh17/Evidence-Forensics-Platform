<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Wireframe 02 - Main Dashboard</title>
  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill: #30352F; }
    .h1 { font-size: 24px; font-weight: 600; }
    .h2 { font-size: 16px; font-weight: 600; }
    .b { font-size: 14px; }
    .bb { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #777A75; }
    .th { font-size: 11px; fill: #777A75; font-weight: 600; letter-spacing: 0.6px; }
    .num { font-size: 30px; font-weight: 600; }
    .card { fill: #FFFFFF; stroke: #E2DCCF; stroke-width: 1; }
    .ic { fill: none; stroke: #30352F; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .ica { fill: none; stroke: #5E735F; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .row { stroke: #EFEAE1; stroke-width: 1; }
  </style>

  <rect width="1440" height="900" fill="#F8F7F3"/>

