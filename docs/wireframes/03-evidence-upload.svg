<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Wireframe 03 - Evidence Upload Page</title>
  <style>
    text { font-family: 'Segoe UI', Inter, Arial, sans-serif; fill: #30352F; }
    .h1 { font-size: 24px; font-weight: 600; }
    .h2 { font-size: 16px; font-weight: 600; }
    .b { font-size: 14px; }
    .bb { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #777A75; }
    .th { font-size: 11px; fill: #777A75; font-weight: 600; letter-spacing: 0.6px; }
    .lbl { font-size: 13px; font-weight: 600; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #30352F; }
    .card { fill: #FFFFFF; stroke: #E2DCCF; stroke-width: 1; }
    .input { fill: #FFFFFF; stroke: #D6D0C3; stroke-width: 1; }
    .ic { fill: none; stroke: #30352F; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .ica { fill: none; stroke: #5E735F; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1440" height="900" fill="#F8F7F3"/>

  <!-- ===== Header ===== -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E2DCCF"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#829783"/>
  <path d="M34 23 h8 l5 5 v13 h-13 z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M37 31 h7 M37 35 h7" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/>
  <text x="68" y="38" class="h2">Digital Evidence Platform</text>
  <text x="1364" y="29" class="bb" text-anchor="end">Demo Investigator</text>
  <text x="1364" y="45" class="s" text-anchor="end">Investigator</text>
  <circle cx="1392" cy="32" r="16" fill="#EDE7DC"/>
  <text x="1392" y="36" class="s" text-anchor="middle" style="fill:#30352F;font-weight:600">DI</text>

  <!-- ===== Sidebar ===== -->
  <rect x="0" y="65" width="240" height="835" fill="#EDE7DC"/>
  <text x="24" y="100" class="th">MENU</text>
  <g transform="translate(0,116)">
    <rect x="36" y="13" width="6" height="6" rx="1.5" class="ic"/>
    <rect x="45" y="13" width="6" height="6" rx="1.5" class="ic"/>
    <rect x="36" y="22" width="6" height="6" rx="1.5" class="ic"/>
    <rect x="45" y="22" width="6" height="6" rx="1.5" class="ic"/>
    <text x="64" y="25" class="b">Dashboard</text>
  </g>
  <g transform="translate(0,164)">
    <path d="M36 14 h5 l2 2 h8 v11 h-15 z" class="ic"/>
    <text x="64" y="25" class="b">Cases</text>
  </g>
  <g transform="translate(0,212)">
    <rect x="16" y="0" width="208" height="40" rx="8" fill="#FFFFFF" stroke="#E2DCCF"/>
    <rect x="16" y="10" width="3" height="20" rx="1.5" fill="#829783"/>
    <path d="M38 12 h7 l4 4 v12 h-11 z" class="ica"/>
    <text x="64" y="25" class="bb">Evidence</text>
  </g>
  <g transform="translate(0,260)">
    <path d="M36 28 h15 M39 25 v-6 M43.5 25 v-11 M48 25 v-4" class="ic"/>
    <text x="64" y="25" class="b">Reports</text>
  </g>

  <!-- ===== Page title ===== -->
  <text x="264" y="112" class="h1">Upload evidence</text>
  <text x="264" y="138" class="b" style="fill:#777A75">Files are hashed with SHA-256 immediately after upload. The original file is never modified.</text>

  <!-- ===== Upload card ===== -->
  <rect x="264" y="164" width="560" height="560" rx="12" class="card"/>

  <text x="288" y="204" class="lbl">1. Select case</text>
  <rect x="288" y="216" width="512" height="44" rx="8" class="input"/>
  <text x="304" y="243" class="b">CASE-2026-014 — Synthetic test case A</text>
  <path d="M774 235 l6 6 l6 -6" class="ic" stroke="#777A75"/>

  <text x="288" y="296" class="lbl">2. Choose evidence file</text>
  <rect x="288" y="308" width="512" height="196" rx="10" fill="#FBFAF7" stroke="#A9B8A9" stroke-width="1.5" stroke-dasharray="8 6"/>
  <!-- upload icon -->
  <circle cx="544" cy="370" r="26" fill="#E3EAE3"/>
  <path d="M544 380 v-20 M535 368 l9 -9 l9 9 M532 384 h24" class="ica" stroke-width="2"/>
  <text x="544" y="428" class="b" text-anchor="middle">Drag &amp; drop a file here, or <tspan style="fill:#5E735F;font-weight:600;text-decoration:underline">browse</tspan></text>
  <text x="544" y="454" class="s" text-anchor="middle">Accepted: PDF, JPG, JPEG, PNG, TXT · max 16 MB</text>

  <!-- selected file row -->
  <rect x="288" y="524" width="512" height="64" rx="10" fill="#F8F7F3" stroke="#E2DCCF"/>
  <rect x="304" y="538" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#E2DCCF"/>
  <path d="M316 546 h8 l5 5 v15 h-13 z" class="ic"/>
  <text x="356" y="552" class="bb">synthetic_incident_note.txt</text>
  <text x="356" y="574" class="s">1.2 KB · TXT (text/plain)</text>
  <path d="M774 550 l12 12 M786 550 l-12 12" class="ic" stroke="#777A75"/>

  <rect x="288" y="612" width="512" height="44" rx="8" fill="#829783"/>
  <text x="544" y="639" class="bb" text-anchor="middle" style="fill:#FFFFFF">Upload &amp; calculate hash</text>

  <text x="288" y="690" class="s">The original file is stored unchanged. Tamper-test copies are kept in a separate folder.</text>

  <!-- ===== Result card ===== -->
  <rect x="848" y="164" width="568" height="560" rx="12" class="card"/>
  <text x="872" y="204" class="h2">Upload result</text>
  <rect x="1240" y="184" width="152" height="28" rx="14" fill="#E3EAE3"/>
  <path d="M1254 198 l4 4 l7 -8" class="ica"/>
  <text x="1274" y="203" class="s" style="fill:#4F6650;font-weight:600">Hash calculated</text>

  <!-- metadata grid -->
  <text x="872" y="248" class="s">File name</text>
  <text x="872" y="270" class="b">synthetic_incident_note.txt</text>
  <text x="1144" y="248" class="s">File type</text>
  <text x="1144" y="270" class="b">TXT · text/plain</text>

  <text x="872" y="306" class="s">File size</text>
  <text x="872" y="328" class="b">1,248 bytes (1.2 KB)</text>
  <text x="1144" y="306" class="s">Uploaded at</text>
  <text x="1144" y="328" class="b">22 Nov 2026, 10:42</text>

  <text x="872" y="364" class="s">Evidence ID</text>
  <text x="872" y="386" class="b">EV-0001</text>
  <text x="1144" y="364" class="s">Case</text>
  <text x="1144" y="386" class="b">CASE-2026-014</text>

  <line x1="872" y1="412" x2="1392" y2="412" stroke="#EDE7DC"/>

  <!-- hash -->
  <text x="872" y="444" class="lbl">SHA-256 hash (recorded at upload)</text>
  <text x="1392" y="444" class="s" text-anchor="end" style="fill:#5E735F;font-weight:600">Copy</text>
  <rect x="872" y="456" width="520" height="48" rx="8" fill="#F8F7F3" stroke="#E2DCCF"/>
  <text x="888" y="485" class="mono">ce90924dad15e62c8b2073ff0135a56ce59c783b5285ad2a8334274d47a594b7</text>

  <line x1="872" y1="528" x2="1392" y2="528" stroke="#EDE7DC"/>

  <!-- verification -->
  <text x="872" y="560" class="lbl">Integrity verification</text>
  <text x="872" y="582" class="s">Recalculates the hash of the stored file and compares it with the recorded hash.</text>
  <rect x="872" y="600" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#829783" stroke-width="1.5"/>
  <text x="957" y="625" class="bb" text-anchor="middle" style="fill:#5E735F">Verify integrity</text>
  <rect x="1060" y="604" width="104" height="32" rx="16" fill="#E3EAE3" stroke="#829783"/>
  <path d="M1076 620 l4 4 l7 -8" class="ica" stroke-width="2"/>
  <text x="1094" y="625" class="bb" style="fill:#4F6650">MATCH</text>
  <text x="872" y="668" class="s">Recalculated hash is identical to the recorded hash.</text>
  <text x="872" y="696" class="b" style="fill:#5E735F;font-weight:600">Run tamper test on a copy →</text>

  <!-- ===== Annotations ===== -->
  <text x="264" y="880" class="s">Wireframe — proposed design (Review 1)</text>
  <rect x="900" y="862" width="516" height="26" rx="13" fill="#E3EAE3" stroke="#829783" stroke-width="1"/>
  <text x="1158" y="879" class="s" text-anchor="middle" style="fill:#4F6650;font-weight:600">Partially implemented in prototype: upload, metadata, SHA-256, verification</text>
</svg>
